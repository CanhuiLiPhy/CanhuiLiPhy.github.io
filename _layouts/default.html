<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset='utf-8'>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}" media="screen" type="text/css">
    <link rel="stylesheet" href="{{ '/assets/css/print.css' | relative_url }}" media="print" type="text/css">

    <!--[if lt IE 9]>
    <script src="https://oss.maxcdn.com/html5shiv/3.7.3/html5shiv.min.js"></script>
    <![endif]-->

{% seo %}

    {% include head-custom.html %}
  </head>

  <body class="{% if page.url == '/' %}is-home{% else %}is-inner-page{% endif %}">
    <header class="site-header">
      <div class="inner site-header-inner">
        <a href="{{ '/' | relative_url }}" class="brand">
          <span class="brand-mark">CL</span>
          <span class="brand-copy">
            <span class="brand-title">{{ site.title | default: site.github.repository_name }}</span>
            <span class="brand-subtitle">{{ site.description | default: site.github.project_tagline }}</span>
          </span>
        </a>

        <nav class="site-nav" aria-label="Primary">
          <a href="{{ '/' | relative_url }}">Home</a>
          <a href="{{ '/' | relative_url }}#research">Research</a>
          <a href="{{ '/' | relative_url }}#projects">Projects</a>
          <a href="{{ '/' | relative_url }}#coursework">Coursework</a>
        </nav>
      </div>
    </header>

    <main class="site-main">
      <div class="inner">
        <section class="content-shell{% unless page.url == '/' %} content-shell-prose{% endunless %}">
          {{ content }}
        </section>
      </div>
    </main>

    <footer class="site-footer">
      <div class="inner site-footer-inner">
        <p>Built with GitHub Pages and customized for a cleaner academic portfolio.</p>
        <a href="{{ site.github.owner_url | default: 'https://github.com/CanhuiLiPhy' }}">GitHub</a>
      </div>
    </footer>

  </body>
</html>
